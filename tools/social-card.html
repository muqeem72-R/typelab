<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; color: #f4f6ff;
    background: radial-gradient(900px 500px at 85% 0%, #5b57e8 0%, rgba(91,87,232,0) 70%), radial-gradient(700px 500px at 0% 100%, #2a78d6 0%, rgba(42,120,214,0) 65%), #151a33; }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .logo { width: 84px; height: 84px; border-radius: 22px; background: #4f46e5; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .logo svg { width: 54px; height: 54px; }
  .name { font-size: 76px; font-weight: 800; letter-spacing: -1.5px; }
  h1 { margin: 0; font-size: 68px; line-height: 1.08; font-weight: 800; letter-spacing: -1px; max-width: 960px; }
  h1 span { color: #ffd479; }
  .sub { margin-top: 20px; font-size: 32px; color: #cfd6ff; max-width: 980px; line-height: 1.35; }
  .keys { display: flex; gap: 12px; }
  .key { min-width: 64px; height: 64px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.28); display: grid; place-items: center; font: 700 30px ui-monospace, Consolas, monospace; color: #fff; }
  .key.hot { background: #ffd479; color: #2a2100; border-color: #ffd479; }
  .url { font-size: 28px; color: #b9c3ff; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; }
</style></head><body><div class="wrap">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></div><div class="name">TypeLab</div></div>
  <div><h1>Learn to <span>touch type</span>, free.</h1>
  <div class="sub">Endless practice that levels up as you type, a 24-lesson course with a programmer track, a leaderboard and a certificate you can share.</div></div>
  <div class="row"><div class="keys"><div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key hot">F</div><div class="key hot">J</div><div class="key">K</div><div class="key">L</div><div class="key">;</div></div><div class="url">Free to use</div></div>
</div></body></html>
